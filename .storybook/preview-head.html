<!--
  Loads the Inter font (Semi bold 600) for the stories. The font-family token is `Inter` with no
  fallback, and `@font-face` rules must be in the main document, not inside the ThemeProvider
  shadow root, so this lives in the preview iframe head. Chromatic renders the same page.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
